
name: Generate and Deploy Event Website

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-public
  cancel-in-progress: false

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Ensure main branch exists
        shell: bash
        run: |
          set -Eeuo pipefail

          git fetch origin

          if git ls-remote --exit-code --heads origin main >/dev/null 2>&1; then
            echo "La rama main existe."

            git fetch origin main
            git checkout -B main origin/main

          else
            echo "La rama main no existe. Creándola desde el commit actual."

            git checkout -B main
            git push -u origin main
          fi

      - name: Generate website
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ ! -f generate.sh ]]; then
            echo "::error::No existe generate.sh en la raíz del repositorio."
            exit 1
          fi

          chmod +x generate.sh
          ./generate.sh

      - name: Validate generated website
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ ! -d public ]]; then
            echo "::error::No se generó el directorio public/"
            exit 1
          fi

          if [[ ! -f public/index.html ]]; then
            echo "::error::No se generó public/index.html"
            exit 1
          fi

          echo "Web generada correctamente."

      - name: Deploy to public branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: public
          force_orphan: true

      - name: Deployment summary
        run: |
          echo "## 🚀 Despliegue completado" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Rama de origen: main" >> "$GITHUB_STEP_SUMMARY"
          echo "- Directorio: public/" >> "$GITHUB_STEP_SUMMARY"
          echo "- Rama de publicación: public" >> "$GITHUB_STEP_SUMMARY"
          echo "- GitHub Pages: listo para publicar" >> "$GITHUB_STEP_SUMMARY"
