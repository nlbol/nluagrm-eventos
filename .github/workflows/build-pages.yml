
name: Generate and Deploy Event Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-public
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Verify project
        run: |
          set -e

          echo "Directorio de trabajo:"
          pwd

          echo "Contenido del repositorio:"
          ls -la

          if [ ! -f generate.sh ]; then
            echo "::error::No se encuentra generate.sh en la raíz."
            exit 1
          fi

      - name: Generate website
        run: |
          set -Eeuo pipefail

          chmod +x ./generate.sh
          ./generate.sh

      - name: Verify generated public directory
        run: |
          set -Eeuo pipefail

          echo "Contenido de public:"
          ls -lah public/

          if [ ! -f public/index.html ]; then
            echo "::error::Falta public/index.html"
            exit 1
          fi

          echo "Archivos que serán publicados:"
          find public -type f

      - name: Deploy to public branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public/
          publish_branch: public
          destination_dir: .
          force_orphan: true
          keep_files: false
          commit_message: "Deploy website from main"

      - name: Verify deployment
        run: |
          echo "## Deploy completado" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "La web se publicó en la raíz de la rama public." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Contenido esperado:" >> "$GITHUB_STEP_SUMMARY"
          echo "- index.html" >> "$GITHUB_STEP_SUMMARY"
          echo "- CSS y JavaScript" >> "$GITHUB_STEP_SUMMARY"
          echo "- assets/" >> "$GITHUB_STEP_SUMMARY"
          echo "- CNAME (si está configurado)" >> "$GITHUB_STEP_SUMMARY"
