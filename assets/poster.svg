<svg xmlns="http://www.w3.org/2000/svg" width="720" height="960" viewBox="0 0 720 960" role="img" aria-label="Afiche DebianDay Bolivia 2026">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071326"/><stop offset="0.55" stop-color="#0d2547"/><stop offset="1" stop-color="#1b1240"/>
    </linearGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a3e635"/><stop offset="0.5" stop-color="#4f7cff"/><stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#4f7cff" stop-opacity=".55"/><stop offset="1" stop-color="#4f7cff" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0v40" fill="none" stroke="#8fb4ff" stroke-opacity=".09"/></pattern>
  </defs>
  <rect width="720" height="960" fill="url(#bg)"/>
  <rect width="720" height="960" fill="url(#grid)"/>
  <circle cx="590" cy="190" r="260" fill="url(#glow)"/>
  <circle cx="90" cy="820" r="220" fill="url(#glow)" opacity=".5"/>
