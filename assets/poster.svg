    <circle cx="28" cy="28" r="6" fill="#a3e635"/><circle cx="50" cy="28" r="6" fill="#4f7cff"/><circle cx="72" cy="28" r="6" fill="#a855f7"/>
    <text x="28" y="82" fill="#7dd3fc" font-family="ui-monospace,monospace" font-size="19">$ whoami</text>
    <text x="28" y="112" fill="#f8fafc" font-family="ui-monospace,monospace" font-size="22" font-weight="700">comunidad_gnu_linux</text>
    <text x="28" y="148" fill="#a3e635" font-family="ui-monospace,monospace" font-size="19">$ ./libertad --run</text>
